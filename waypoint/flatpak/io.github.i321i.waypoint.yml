app-id: io.github.i321i.waypoint
# org.gnome.Platform 46 含 libwebkit2gtk-4.1（Tauri v2 + wry 0.54 link 到此版本）。
# org.freedesktop.Platform 24.08 不含 4.1，runtime 載 binary 時直接 dlopen 失敗，
# Steam Deck v0.2.x flatpak 全部跑不起來就是這原因。
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: waypoint

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=session-bus
  - --filesystem=~/waypoint
  - --filesystem=~/.config/autostart:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  # global shortcut（KDE kglobalaccel + XDG portal）
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.freedesktop.portal.Desktop
  # X11 global key grab（fallback-x11 模式下 XGrabKey 需要此權限）
  - --device=dri

modules:
  # libayatana-appindicator chain：org.gnome.Platform/46 不含這 lib，
  # tray-icon (libappindicator-sys) 載不到 .so 會 panic（v0.2.5 起被
  # catch_unwind 吞掉但失去小圖示）。把整條依賴 build 進 flatpak 才會有 tray。
  - name: libdbusmenu-gtk3
    buildsystem: autotools
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --disable-introspection
      - --disable-vala
    build-options:
      env:
        HAVE_VALGRIND_FALSE: '#'
        HAVE_VALGRIND_TRUE: ''
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bf8e16d

  - name: libayatana-common
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-common.git
        tag: 0.9.11

  - name: ayatana-ido
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.4

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.93

  - name: waypoint
    buildsystem: simple
    build-commands:
      - install -Dm755 waypoint /app/bin/waypoint
      - install -Dm644 io.github.i321i.waypoint.desktop /app/share/applications/io.github.i321i.waypoint.desktop
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/io.github.i321i.waypoint.png
    sources:
      - type: file
        path: waypoint
      - type: file
        path: io.github.i321i.waypoint.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
