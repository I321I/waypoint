app-id: io.github.i321i.waypoint
# org.gnome.Platform 46 含 libwebkit2gtk-4.1（Tauri v2 + wry 0.54 link 到此版本）。
# org.freedesktop.Platform 24.08 不含 4.1，runtime 載 binary 時直接 dlopen 失敗，
# Steam Deck v0.2.x flatpak 全部跑不起來就是這原因。
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: waypoint

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=session-bus
  - --filesystem=~/waypoint
  - --filesystem=~/.config/autostart:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  # global shortcut（KDE kglobalaccel + XDG portal）
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.freedesktop.portal.Desktop
  # X11 global key grab（fallback-x11 模式下 XGrabKey 需要此權限）
  - --device=dri

modules:
  # libayatana-appindicator chain：org.gnome.Platform/46 不含這 lib，
  # tray-icon (libappindicator-sys) 載不到 .so 會 panic（v0.2.5 起被
  # catch_unwind 吞掉但失去小圖示）。把整條依賴 build 進 flatpak 才會有 tray。
  - name: libdbusmenu-gtk3
    # libdbusmenu 16.04.0 的 configure.ac 用過時 IT_PROG_INTLTOOL macro，
    # 跟 GNOME Sdk//46 內附的新版 intltool 不相容（v0.2.9 ubuntu matrix 卡這）。
    # 改 simple buildsystem：先把 IT_PROG_INTLTOOL 段拿掉再 autoreconf 重建。
    buildsystem: simple
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
    build-options:
      # libdbusmenu 用過時 glib macro 觸發 -Werror（v0.2.10 ubuntu matrix 卡這）。
      # 關掉 -Werror，warning 不阻擋 build。
      cflags: -Wno-error
      cxxflags: -Wno-error
      env:
        HAVE_VALGRIND_FALSE: '#'
        HAVE_VALGRIND_TRUE: ''
    build-commands:
      # 全方面拿掉 intltool / po：configure.ac 的 IT_PROG_INTLTOOL macro、
      # po/Makefile.in 與 po/POTFILES 引用、Makefile.am 的 po SUBDIR、
      # 還有 po/ 子目錄本體。不這樣做，subdir 的 config.status 會回呼 parent
      # 重建 po/Makefile.in 進入無限遞迴（v0.2.12 9 萬+次 config.status 把 90min timeout 吃光）。
      # 改 perl：BRE quantifier escape 太脆弱（v0.2.13/14 sed 沒匹配到，automake 還是炸）。
      - echo "--- Makefile.am before patch ---"
      - grep -n . Makefile.am | head -40
      - perl -i -pe 's/IT_PROG_INTLTOOL.*//g' configure.ac
      - perl -i -ne 'print unless m{po/Makefile} || m{po/POTFILES}' configure.ac
      - perl -i -ne 'print unless m{^\s*po\s*\\?\s*$} || m{^\s*po/Makefile}' Makefile.am
      # 還可能 po 跟其他 SUBDIRS 同行（不換行）：把 po 整段（含前後空白與可選反斜線）替換成單一空白
      - perl -i -pe 's/(?<=\s)po(?=[\s\\]|$)\s*\\?\s*/ /g' Makefile.am
      # 拔掉 dangling backslash：v0.2.15 看 debug 後發現 po 是 SUBDIRS 最後一個 entry，
      # 刪掉它後前一行 (	docs \) 的 \ 變成接空行，automake 罵 "blank line following trailing backslash"。
      - perl -i -p0e 's/\\([ \t]*\n[ \t]*\n)/$1/g' Makefile.am
      - echo "--- Makefile.am after patch ---"
      - grep -n . Makefile.am | head -40
      - rm -rf po/
      - autoreconf -fi </dev/null
      - >-
        ./configure --prefix=/app --with-gtk=3 --disable-dumper --disable-static
        --disable-tests --disable-gtk-doc --disable-introspection --disable-vala
      - make -j$(nproc) CFLAGS="-Wno-error -Wno-deprecated-declarations"
      - make install

  - name: libayatana-common
    # libayatana-common data/CMakeLists.txt 呼叫 find_package(GSettings REQUIRED)
    # + add_schema()，正常由 Debian cmake-extras 提供 FindGSettings.cmake。
    # flatpak runtime 跟 ECM v6.0.0 都沒有（v0.2.16/17 卡這），自附最小實作
    # 塞進 source dir 的 cmake/，libayatana-common 主 CMakeLists.txt 已把
    # ${CMAKE_SOURCE_DIR}/cmake 加進 CMAKE_MODULE_PATH，會自動找到。
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-common.git
        tag: 0.9.11
      - type: file
        path: FindGSettings.cmake
        dest: cmake
      - type: file
        path: FindIntltool.cmake
        dest: cmake

  - name: ayatana-ido
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.4

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.93

  - name: waypoint
    buildsystem: simple
    build-commands:
      - install -Dm755 waypoint /app/bin/waypoint
      - install -Dm644 io.github.i321i.waypoint.desktop /app/share/applications/io.github.i321i.waypoint.desktop
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/io.github.i321i.waypoint.png
    sources:
      - type: file
        path: waypoint
      - type: file
        path: io.github.i321i.waypoint.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
