<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waypoint</title>
    <!-- 在 head 階段先決定 body bg：note 視窗（webview 已 transparent）給透明，
         其他視窗給深色防白屏。放 body 內 inline style 太晚會閃一下深色。 -->
    <style id="initial-bg">body{background:#1e1e1e;color:#cccccc}</style>
    <script>
      if (location.hash.indexOf('view=note') !== -1) {
        var s = document.getElementById('initial-bg');
        if (s) s.textContent = 'body{background:transparent;color:#cccccc}';
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
