name: E2E (Windows / WebView2)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            waypoint/src-tauri/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('waypoint/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Prepare logs dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path waypoint/logs | Out-Null

      - name: Install tauri-driver
        shell: pwsh
        run: cargo install tauri-driver --locked *>&1 | Tee-Object -FilePath waypoint/logs/01-tauri-driver.log; exit $LASTEXITCODE

      - name: Install frontend dependencies
        working-directory: waypoint
        shell: pwsh
        run: |
          (npm ci *>&1) -join "`n" | Out-File -FilePath logs/02-npm-install.log -Encoding utf8
          if ($LASTEXITCODE -ne 0) { npm install *>&1 | Tee-Object -FilePath logs/02-npm-install.log -Append; exit $LASTEXITCODE }

      - name: Build frontend
        working-directory: waypoint
        shell: pwsh
        run: npm run build *>&1 | Tee-Object -FilePath logs/03-build-frontend.log; exit $LASTEXITCODE

      - name: Build Tauri binary (release, no bundle)
        working-directory: waypoint
        shell: pwsh
        run: npx tauri build --no-bundle *>&1 | Tee-Object -FilePath logs/04-tauri-build.log; exit $LASTEXITCODE

      - name: Disable runner's bundled msedgedriver
        # runner 自帶 C:\SeleniumWebDrivers\MsEdgeDriver\<ver>\msedgedriver.exe 永遠是
        # 最新版（148+），跟 runner 內裝的 Edge browser（往往落後一個版本）對不起來。
        # 即使下一步用 GITHUB_PATH prepend 自己抓的 driver，tauri-driver 仍可能掃到舊路徑。
        # 直接把 runner 的 driver rename 掉，逼之後的 step 用我們下載的版本。
        shell: pwsh
        run: |
          Get-ChildItem -Path "C:\SeleniumWebDrivers" -Recurse -Filter msedgedriver.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $bak = "$($_.FullName).bak"
            Move-Item -Force -Path $_.FullName -Destination $bak
            Write-Host "Renamed $($_.FullName) -> $bak"
          }

      - name: Download msedgedriver matching installed Edge version
        # runner 內建的 msedgedriver (C:\SeleniumWebDrivers) 跟 Edge browser 各自更新，
        # 經常不對版（v0.2.21~v0.2.23 e2e-windows 連續紅，driver 148 / browser 147）。
        # 改成偵測 Edge 真實版本後從 Microsoft CDN 抓對應 driver。多個 URL fallback：
        # - 精確版本（msedgedriver.azureedge.net）
        # - LATEST_RELEASE_<major>_WINDOWS（同主版本下最新）
        # - 同樣兩種 URL 用 microsoft.com domain（azureedge.net 在 2026 部分區域 deprecated）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $edgePath = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edgePath)) {
            $edgePath = "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $edgePath)) { throw "msedge.exe not found" }
          $version = (Get-Item $edgePath).VersionInfo.FileVersion
          $major = $version.Split('.')[0]
          Write-Host "Edge browser version: $version (major=$major)"

          # 蒐集 candidate URLs（順序 = 嘗試順序）
          $urls = @(
            "https://msedgedriver.azureedge.net/$version/edgedriver_win64.zip",
            "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip"
          )
          foreach ($host_url in @('https://msedgedriver.azureedge.net','https://msedgedriver.microsoft.com')) {
            try {
              $latestVer = (Invoke-WebRequest -Uri "$host_url/LATEST_RELEASE_${major}_WINDOWS" -UseBasicParsing -TimeoutSec 30).Content.Trim() -replace "`0",""
              Write-Host "LATEST_RELEASE_${major}_WINDOWS from $host_url => $latestVer"
              $urls += "$host_url/$latestVer/edgedriver_win64.zip"
            } catch {
              Write-Host "LATEST_RELEASE query failed on $host_url : $_"
            }
          }

          $zip = "$env:TEMP\edgedriver.zip"
          $dest = "$env:TEMP\edgedriver"
          $ok = $false
          foreach ($url in $urls) {
            Write-Host "Trying $url"
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 60
              if ((Get-Item $zip).Length -lt 1024) { throw "downloaded file too small (likely error page)" }
              $ok = $true
              break
            } catch {
              Write-Host "  failed: $_"
            }
          }
          if (-not $ok) { throw "All msedgedriver download URLs failed" }

          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $driver = Get-ChildItem -Path $dest -Recurse -Filter msedgedriver.exe | Select-Object -First 1
          if (-not $driver) { throw "msedgedriver.exe not in archive" }
          Add-Content $env:GITHUB_PATH $driver.DirectoryName
          Write-Host "msedgedriver at $($driver.FullName)"
          & $driver.FullName --version

      - name: Run E2E tests (capture stdout/stderr)
        working-directory: waypoint
        shell: pwsh
        env:
          WAYPOINT_BINARY: ${{ github.workspace }}\waypoint\src-tauri\target\release\waypoint.exe
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          npm run test:e2e *>&1 | Tee-Object -FilePath logs/wdio-full.log
          exit $LASTEXITCODE

      - name: Upload E2E logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs-${{ github.run_attempt }}
          path: |
            waypoint/logs/
            waypoint/.wdio-logs/
          retention-days: 14
          if-no-files-found: warn

      # 失敗時把所有 log push 到 ci-logs/<sha> 孤兒分支，方便用 MCP get_file_contents 免 token 讀取
      - name: Push logs to ci-logs branch on failure
        if: failure()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          BR="ci-logs/${{ github.sha }}-${{ github.run_attempt }}"
          git config user.email "ci-bot@waypoint"
          git config user.name "ci-bot"
          git checkout --orphan "$BR"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p logs
          if [ -d waypoint/logs ]; then cp -r waypoint/logs/. logs/ 2>/dev/null || true; fi
          if [ -d waypoint/.wdio-logs ]; then cp -r waypoint/.wdio-logs logs/wdio-logs-dir 2>/dev/null || true; fi
          ls -la logs/ > logs/_INDEX.txt 2>&1 || true
          echo "github.sha=${{ github.sha }}" > logs/_meta.txt
          echo "attempt=${{ github.run_attempt }}" >> logs/_meta.txt
          echo "run_id=${{ github.run_id }}" >> logs/_meta.txt
          git add -A logs/
          git commit -m "ci log ${{ github.sha }} attempt ${{ github.run_attempt }}" --allow-empty
          git push origin "$BR" --force
